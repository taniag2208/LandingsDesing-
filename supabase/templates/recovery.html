<div style="font-family:Inter,Arial,sans-serif;max-width:520px;margin:0 auto;padding:32px;color:#13111f">
  <p style="font-weight:800;letter-spacing:.08em;color:#5b3df5;margin:0 0 24px">TITA LANDING STUDIO</p>
  <h1 style="font-size:22px;margin:0 0 12px">Restablece tu contraseña</h1>
  <p style="color:#4a4563;line-height:1.6">Recibimos una solicitud para cambiar la contraseña de tu cuenta.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="background:#5b3df5;color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:600">Crear nueva contraseña</a>
  </p>
  <p style="color:#9893ad;font-size:12px">Si no lo solicitaste, ignora este mensaje. Tu contraseña no cambiará.</p>
</div>
